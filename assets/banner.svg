<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Lumen — a daily journal, in any language">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0E13"/>
      <stop offset="50%" stop-color="#151320"/>
      <stop offset="100%" stop-color="#1A1824"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <ellipse cx="600" cy="200" rx="520" ry="220" fill="url(#glow)"/>

  <!-- constellation -->
  <g fill="#FBBF24" opacity="0.55">
    <circle cx="140" cy="72" r="1.4"/>
    <circle cx="220" cy="48" r="1"/>
    <circle cx="95" cy="180" r="1.2"/>
    <circle cx="170" cy="290" r="1.5"/>
    <circle cx="1040" cy="88" r="1.4"/>
    <circle cx="960" cy="54" r="1"/>
    <circle cx="1095" cy="180" r="1.2"/>
    <circle cx="1020" cy="280" r="1.5"/>
    <circle cx="310" cy="310" r="1"/>
    <circle cx="880" cy="320" r="1"/>
  </g>

  <!-- flame glow -->
  <g transform="translate(540, 80)" filter="url(#soft)">
    <ellipse cx="30" cy="60" rx="36" ry="42" fill="#FBBF24" opacity="0.35"/>
  </g>

  <!-- flame mark -->
  <g transform="translate(540, 70)">
    <path d="M30 8
             C 18 30, 12 42, 18 58
             C 22 50, 28 48, 32 52
             C 28 38, 40 28, 38 14
             C 46 26, 54 40, 52 56
             C 50 78, 34 96, 18 92
             C 4 88, -2 72, 6 58
             C 10 68, 20 70, 22 62
             C 14 54, 16 36, 30 8 Z"
          fill="url(#flame)"/>
    <circle cx="28" cy="66" r="5" fill="#FEF3C7" opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="218" font-family="'Cormorant Garamond','Playfair Display',Georgia,serif"
        font-size="108" font-weight="300" text-anchor="middle"
        fill="url(#textGrad)" letter-spacing="10">Lumen</text>

  <!-- tagline -->
  <text x="600" y="268" font-family="'Inter',system-ui,sans-serif"
        font-size="15" font-weight="500" text-anchor="middle"
        fill="#E8DCC4" opacity="0.78" letter-spacing="8">
    A DAILY JOURNAL &#8226; IN ANY LANGUAGE
  </text>

  <!-- bottom hairline -->
  <line x1="460" y1="296" x2="740" y2="296" stroke="#FBBF24" stroke-opacity="0.25" stroke-width="1"/>
</svg>
