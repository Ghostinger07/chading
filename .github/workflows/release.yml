name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g. v0.1.0). Leave empty to only build artifact.'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build (root-relative, portable)
        env:
          BASE_PATH: ./
        run: npm run build

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package dist
        run: |
          mkdir -p artifacts
          cd dist
          zip -r "../artifacts/chading-${{ steps.version.outputs.tag }}.zip" .
          cd ..
          tar -czf "artifacts/chading-${{ steps.version.outputs.tag }}.tar.gz" -C dist .

      - name: Upload build artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: chading-${{ steps.version.outputs.tag }}
          path: artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Chading ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Chading ${{ steps.version.outputs.tag }}

            Multilingual daily journal with tasks, built with React + Material UI.

            ### Download
            - `chading-${{ steps.version.outputs.tag }}.zip` — static build, open `index.html` in any browser or host on any static server.
            - `chading-${{ steps.version.outputs.tag }}.tar.gz` — same, tarball.

            ### Run locally from the zip
            ```bash
            unzip chading-${{ steps.version.outputs.tag }}.zip -d chading
            cd chading
            # any static server works, e.g.:
            python3 -m http.server 8080
            # then open http://localhost:8080
            ```

            ### Live demo
            https://ghostinger07.github.io/chading/
